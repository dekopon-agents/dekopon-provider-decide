[workspace]

[package]
name = "dekopon-decide-provider"
version = "0.1.1"
edition = "2024"
rust-version = "1.98.1"
license = "MIT OR Apache-2.0"
description = "Advisory OpenRouter Decisions component for Dekopon"
repository = "https://github.com/dekopon-agents/dekopon-provider-decide"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
clap = { version = "=4.6.6", features = ["derive"] }
dekopon-provider-sdk = "=0.47.0"
schemars = "=1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[dev-dependencies]
dekopon-provider-sdk-testkit = "=0.47.0"
